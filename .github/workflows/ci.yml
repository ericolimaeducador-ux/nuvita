name: CI

on:
  push:
    branches: [main, integracao, 'estomaterapia/**']
  pull_request:
    branches: [main, 'estomaterapia/integracao', 'estomaterapia/**']

jobs:
  api:
    name: API — Type-check, Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Lint
        working-directory: apps/api
        run: npx eslint "{src,test}/**/*.ts" --max-warnings 0

      - name: Type check
        working-directory: apps/api
        run: npx tsc --noEmit

      - name: Build
        working-directory: apps/api
        run: npx nest build

      - name: Tests
        working-directory: apps/api
        run: npx jest --passWithNoTests

      # Gate de vulnerabilidades nas dependências que vão para produção
      # (--omit=dev: o que roda no container, não o ferramental de build).
      #
      # O nível está em `critical` e não em `high` porque hoje restam 5 highs
      # que só saem com a migração Nest 10 -> 11 (multer via
      # @nestjs/platform-express; js-yaml e lodash via @nestjs/swagger). Baixar
      # para `high` agora deixaria o CI vermelho de forma permanente, o que
      # treina todo mundo a ignorar o gate. Apertar para `high` junto com a
      # migração — ver infra/PRODUCTION-BACKEND.md, seção 9.
      - name: Auditoria de dependências de produção
        run: npm audit --omit=dev --audit-level=critical

  web:
    name: Web — Type-check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Type check & build
        working-directory: apps/web
        run: npm run build

      # Testes unitários do web (vitest). Teste que não roda no CI não entra: o job falha se algum quebrar.
      - name: Testes unitários (vitest)
        working-directory: apps/web
        run: npm test
