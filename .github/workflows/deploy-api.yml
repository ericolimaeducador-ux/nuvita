name: Deploy API to Cloud Run

# Build da imagem no runner (docker build a partir do Dockerfile da raiz) +
# push para o Artifact Registry + deploy da API no Cloud Run com --image.
#
# NÃO usa `gcloud run deploy --source` (que dispararia Cloud Build e exigiria
# permissões de projeto: storage.buckets.create, cloudbuild.builds.create).
# Buildar no runner mantém o deploy como update puro de serviço, coberto por
# roles/run.admin ESCOPADO ao recurso nuvita-psi-api.
#
# Autenticação via Workload Identity Federation (OIDC) — sem chave de SA de
# longa duração. Identidade: nuvita-psi-deployer@ (secret GCP_SA_EMAIL),
# federada só ao repo ericolimaeducador-ux/nuvita-psi.
#
# Secrets (Settings > Secrets and variables > Actions):
#   - GCP_PROJECT_ID     nuvita-499800 (mesmo projeto GCP do Nuvita original;
#                        nuvita-psi roda como serviço Cloud Run próprio).
#   - GCP_WIF_PROVIDER   projects/<num>/locations/global/workloadIdentityPools/<pool>/providers/<prov>.
#   - GCP_SA_EMAIL       nuvita-psi-deployer@nuvita-499800.iam.gserviceaccount.com.
#   - CLOUDRUN_ENV_YAML  Conteúdo COMPLETO do cloudrun.env.yaml (segredos da API).
#                        Gere com `node scripts/gen-cloudrun-env.cjs` e cole aqui.
on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

# Um deploy por vez; não cancela um deploy em andamento.
concurrency:
  group: cloud-run-api
  cancel-in-progress: false

# id-token: write é obrigatório para o OIDC do Workload Identity Federation.
permissions:
  contents: read
  id-token: write

env:
  SERVICE: nuvita-psi-api
  REGION: southamerica-east1
  # Repositório Artifact Registry já existente no projeto; nuvita-psi-deployer
  # tem roles/artifactregistry.writer ESCOPADO a ele.
  IMAGE_REPO: cloud-run-source-deploy

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configura o Docker para o Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build da imagem no runner
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${IMAGE_REPO}/${SERVICE}:${{ github.sha }}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -f Dockerfile -t "$IMAGE" .

      - name: Push da imagem para o Artifact Registry
        run: docker push "$IMAGE"

      - name: Write env-vars file (masked)
        env:
          # Passa o secret via env (expandido em runtime) em vez de interpolar no
          # script: os valores são JSON-quoted (contêm aspas) e quebrariam o shell.
          CLOUDRUN_ENV: ${{ secrets.CLOUDRUN_ENV_YAML }}
        run: |
          printf '%s' "$CLOUDRUN_ENV" > cloudrun.env.yaml
          echo "Linhas no env-vars-file: $(wc -l < cloudrun.env.yaml)"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "$REGION" \
            --service-account nuvita-psi-api-runtime@nuvita-499800.iam.gserviceaccount.com \
            --allow-unauthenticated \
            --env-vars-file cloudrun.env.yaml \
            --quiet

      - name: Show service URL
        run: |
          gcloud run services describe "$SERVICE" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "$REGION" \
            --format='value(status.url)'

      - name: Cleanup secrets file
        if: always()
        run: rm -f cloudrun.env.yaml
